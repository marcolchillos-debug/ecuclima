name: Ofertas - revision diaria de stock y precios

# RESERVA, SIN HORARIO. Desde el 2026-10-24 la revision diaria corre en la PC de la oficina (tarea Ecuclima-Ofertas-Diaria, todas las noches a las 22:07),
# porque asi lo pidio Marco y porque los horarios de GitHub se atrasan horas (la corrida de las 22:07 salio a las 03:27) y Google lee el archivo a las 0:00.
# Este flujo solo se corre a mano (Actions > Run workflow) si algun dia la oficina no puede. Mientras no exista el secreto OFERTAS_SECRETOS no hace nada.
# Lee en FileMaker (solo lectura) el stock y el PVP de lo publicado en ecuclima.com/ofertas.html y publica los cambios seguros.
# El codigo esta en .github/ofertas/ (ver LEEME.md alli). Los secretos (FileMaker y correo) irian en Settings > Secrets and variables > Actions > OFERTAS_SECRETOS.

on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'Que hacer'
        type: choice
        default: publicar
        options:
          - publicar
          - solo_mirar
          - probar_correo

permissions:
  contents: write     # guardar los 3 archivos de ofertas y el estado de los avisos
  pages: write        # pedir la construccion de GitHub Pages despues de publicar

concurrency:
  group: ofertas-diaria
  cancel-in-progress: false

jobs:
  ofertas:
    runs-on: ubuntu-24.04      # version fija: ubuntu-latest esta migrando a Ubuntu 26
    timeout-minutes: 25
    env:
      OFERTAS_ACTIONS: '1'
      TZ: America/Guayaquil
      PYTHONUTF8: '1'
      OFERTAS_SECRETOS: ${{ secrets.OFERTAS_SECRETOS }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/ofertas
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Preparar secretos
        id: sec
        run: python .github/ofertas/preparar_secretos.py

      - name: Revisar y publicar
        if: steps.sec.outputs.activo == 'true'
        working-directory: .github/ofertas
        env:
          ACCION: ${{ github.event.inputs.accion || 'publicar' }}
        run: |
          case "$ACCION" in
            solo_mirar)    python -m catalogo.ofertas_semanal ;;
            probar_correo) python -m catalogo.ofertas_semanal --probar-correo ;;
            *)             python -m catalogo.ofertas_semanal --publicar --correo ;;
          esac
